[package]
name = "rosary-crypto"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Selective field encryption for bead federation"
readme = "README.md"
keywords = ["encryption", "chacha20poly1305", "federation"]
categories = ["cryptography"]
# Not yet published; flip deliberately if a publish story lands (rosary-d19eca).
publish = false

[dependencies]
chacha20poly1305 = "0.10"
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
