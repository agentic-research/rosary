[package]
name = "bdr"
version = "0.3.0"
edition.workspace = true
description = "Bead Decision Records — Harmony lattice decomposition for ADRs"
# Deliberately Apache-2.0 (not the workspace AGPL): bdr is the liberally-licensed
# decomposition core.
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["adr", "decomposition", "agents", "planning"]
categories = ["development-tools"]
# Not yet published; `bdr` is free on crates.io as of 2026-07-15 (rosary-d19eca).
publish = false

[dependencies]
openai-harmony = "0.0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
pretty_assertions = "1"
