version: '3'

# Assembled from per-concern modules — Taskfile is the source of truth and CI
# hooks into these targets (never raw tool commands). `image:` owns the OCI
# build/publish path (`task image:build` / `image:release`).
includes:
  image: .taskfiles/image.yml

vars:
  # ley-line-open ships a fuse.pc wrapper that maps fuse-t for the fuser
  # crate. Adjust LEY_LINE_DIR if ley-line-open is checked out elsewhere.
  LEY_LINE_DIR: '{{.ROOT_DIR}}/../ley-line-open'
  FUSE_PKG_CONFIG_PATH:
    sh: 'if [ "$(uname)" = "Darwin" ]; then echo "{{.LEY_LINE_DIR}}/rs/pkgconfig"; fi'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  UNAME_M:
    sh: uname -m

env:
  PKG_CONFIG_PATH: '{{.FUSE_PKG_CONFIG_PATH}}'
  # Disable inherited rustc wrappers (notably sccache) inside task recipes by
  # default. Sandboxed Codex verification cannot always execute those wrappers;
  # users who want one can still pass CARGO_BUILD_RUSTC_WRAPPER explicitly.
  CARGO_BUILD_RUSTC_WRAPPER: '{{.CARGO_BUILD_RUSTC_WRAPPER | default ""}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build rsry binary (debug)
    cmds:
      - cargo build

  release:
    desc: Build rsry binary (release)
    cmds:
      - cargo build --release

  test:
    desc: Run all tests (Rust + Elixir)
    cmds:
      - cargo test

  compile:
    desc: Compile check without codegen
    cmds:
      - cargo check

  taskfile-contract:
    desc: Verify Taskfile remains the source of truth for CI/check gates
    cmds:
      - bash scripts/check-taskfile-contract.sh

  rules:
    desc: >-
      Rosary-domain mechanical gates that CI and dispatched agents must run.
      They live here (inside the canonical `task check`) rather than only in the
      local pre-commit hooks, because agents run `task check`, not pre-commit —
      so a pre-commit-only gate enforces nothing on the dispatch path.
      Structural code smells (god_file/long_file/dead_code/…) are NOT re-listed
      here: those are mache's rule engine (JSON-of-SQL over the AST + `--baseline`
      ratchet, ADR-0018), run via `task smells` locally and the reusable mache
      find-smells action in CI (.github/workflows/smells.yml) — not reinvented in
      bash. This target holds only the domain rules mache does not own.
    cmds:
      # R4b — imperative persist_status() call sites may only decrease. Kept as a
      # rosary script (not a mache rule) because mache's call-extraction
      # under-counts it (node_refs sees 16 of the 21 real sites), so the bash
      # grep is the accurate ratchet for this specific migration.
      - task: persist-status-ratchet

  smells:
    desc: >-
      mache structural-smell ratchet (ADR-0018) — the god_file/long_file/
      dead_code/duplicate/… gate, owned by mache's rule registry (JSON-of-SQL over
      the AST), NOT reinvented in bash. Builds a mache index over the repo and
      fails on findings that EXCEED the committed docs/smell-baseline.json (the
      per-(rule,file) ratchet floor). Custom rosary rules live as JSON in
      docs/smell-rules/ (loaded via MACHE_SMELL_RULES_DIR) — e.g. long_file_rosary
      is Golden Rule 2 (>500 lines), which retired scripts/check-file-length.sh.
      CI runs the identical gate via the reusable `agentic-research/mache`
      find-smells action; this target is the local mirror. Requires mache >=
      v0.13.0 (it auto-provisions the leyline backend so all _ast rules run).
      Regenerate the baseline after an intentional change with:
      `MACHE_SMELL_RULES_DIR=docs/smell-rules mache find-smells --db <db> --rule '*'
      --limit 100000 --baseline-root "$PWD" --write-baseline docs/smell-baseline.json`.
    env:
      MACHE_SMELL_RULES_DIR: '{{.TASKFILE_DIR}}/docs/smell-rules'
    cmds:
      - |
        if ! command -v mache >/dev/null 2>&1; then
          echo "SKIP: mache not on PATH — install mache >= v0.13.0 for the structural"
          echo "      smell gate. CI enforces it via the mache find-smells action."
          exit 0
        fi
        DB="$(mktemp -u).db"
        trap 'rm -f "$DB"' EXIT
        mache build . "$DB"
        mache find-smells --db "$DB" --rule '*' --limit 100000 \
          --baseline-root "$PWD" --baseline docs/smell-baseline.json

  check:
    desc: Canonical verification gate (Taskfile source of truth)
    cmds:
      - task: taskfile-contract
      - task: rules
      - task: compile
      - task: lint
      - task: test
      # Structural smell ratchet — enforced locally where mache is present, and in
      # CI via the reusable mache find-smells action (.github/workflows/smells.yml).
      # Skips (exit 0) when mache is absent, so the mache-less CI `verify` job that
      # runs `task check` doesn't fail; the action is the CI enforcement point.
      - task: smells

  lint:
    desc: Run fmt + clippy + semgrep rules
    deps: [fmt]
    cmds:
      - cargo clippy -- -D warnings
      # Semgrep via a wrapper that degrades cleanly when it's present but
      # unusable (e.g. X509 trust-init failure in a sandbox) — rosary-9e5138.
      # Still fails on real findings. Tested by scripts/run-semgrep.test.sh.
      - bash scripts/run-semgrep.sh .semgrep/rules.yml .

  fmt:
    desc: Format code
    cmds:
      - cargo fmt

  persist-status-ratchet:
    desc: "Imperative persist_status() call sites may only decrease (R4b — state = fold, not scattered mutation)"
    cmds:
      - bash scripts/check-persist-status-ratchet.sh

  god-files:
    desc: >-
      Report god-files (structural view for the R6 breakdown campaign) via mache's
      long_file/god_file rules. Reporting only — the enforced gate is `task smells`
      (ratcheted against docs/smell-baseline.json). The old wc -l script
      (check-god-files.sh) was retired: it duplicated mache's long_file (>1500).
    cmds:
      - |
        if command -v mache >/dev/null 2>&1; then
          DB="$(mktemp -u).db"
          trap 'rm -f "$DB"' EXIT
          mache build . "$DB" >/dev/null 2>&1 && {
            echo "=== mache long_file (>1500) + god_file ==="
            mache find-smells --db "$DB" --rule long_file --format ci 2>/dev/null || true
            mache find-smells --db "$DB" --rule god_file  --format ci 2>/dev/null || true
          }
        else
          echo "SKIP: mache not on PATH — install for the structural view"
        fi

  install:
    desc: Build, codesign, install rsry, and set up HTTP MCP service
    # Compose from the named release + lint tasks rather than reinventing
    # them inline. `release` produces the binary; `lint` (clippy -D warnings,
    # via its fmt dep) gates the install so we don't ship a binary that
    # wouldn't pass CI. Both are cached by taskfile if they ran in the
    # same invocation, so `task check && task install` doesn't double-build.
    deps: [release, lint]
    cmds:
      - |
        # Check for existing rsry in PATH (brew, cargo install, system package)
        EXISTING=$(command -v rsry 2>/dev/null || true)
        if [ -n "$EXISTING" ] && [ "$EXISTING" != "$HOME/.local/bin/rsry" ]; then
          EXISTING_VER=$("$EXISTING" --version 2>/dev/null || echo "unknown")
          NEW_VER=$(cargo metadata --format-version 1 --no-deps 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])" 2>/dev/null || echo "dev")
          echo "WARNING: found rsry at $EXISTING ($EXISTING_VER)"
          echo "         task install will place rsry at ~/.local/bin/rsry ($NEW_VER)"
          # Check if it's a brew install specifically
          if echo "$EXISTING" | grep -q "homebrew\|Cellar"; then
            echo "         Suggestion: brew unlink rosary"
          fi
          echo ""
          read -p "Continue? [Y/n] " -n 1 -r
          echo
          if [[ ! $REPLY =~ ^[Yy]?$ ]]; then
            echo "Aborted."
            exit 1
          fi
        fi
      - mkdir -p ~/.local/bin ~/.rsry
      # Stage + codesign in /tmp, then atomic rename to install path.
      # This ensures WatchPaths sees exactly one change (the rename),
      # not two (cp then codesign modifying in-place).
      - cp target/release/rsry /tmp/rsry-staged
      - codesign -s - --force --deep --entitlements entitlements.plist /tmp/rsry-staged
      - mv /tmp/rsry-staged ~/.local/bin/rsry
      # Restart is handled by install-service via `launchctl kickstart -k`
      # (rosary-de1237) — WatchPaths/touch didn't reliably fire on the
      # atomic-rename inode swap, so the service ran stale for days.
      - echo "Installed rsry to ~/.local/bin/rsry (codesigned)"
      - task: install-service

  install-service:
    desc: Install/update launchd service for rsry HTTP MCP server (macOS)
    platforms: [darwin]
    cmds:
      - |
        PLIST="$HOME/Library/LaunchAgents/com.rosary.serve.plist"
        LABEL="com.rosary.serve"
        BIN="$HOME/.local/bin/rsry"
        LOG="$HOME/.rsry/http.log"
        STAGED="/tmp/com.rosary.serve.plist.staged"
        sed -e "s|__RSRY_BIN__|$BIN|g" -e "s|__RSRY_LOG__|$LOG|g" -e "s|__HOME__|$HOME|g" -e "s|__USER__|$USER|g" \
          scripts/com.rosary.serve.plist.template > "$STAGED"
        # Only reload launchd if the plist content has actually changed
        # (or doesn't exist yet). On normal `task install`, the binary
        # changes but the plist doesn't — a kickstart restarts on the new
        # binary (WatchPaths was unreliable on atomic rename — rosary-de1237).
        if [ ! -f "$PLIST" ] || ! diff -q "$STAGED" "$PLIST" >/dev/null 2>&1; then
          cp "$STAGED" "$PLIST"
          launchctl unload "$PLIST" 2>/dev/null || true
          launchctl load "$PLIST"
          echo "HTTP MCP service (re)loaded (plist changed)"
        elif ! launchctl list "$LABEL" >/dev/null 2>&1; then
          # Plist unchanged but the agent is NOT loaded (crashed, manually
          # unloaded, or never loaded because nothing was listening). Load it so
          # agents always find the MCP server at session start (rosary-0e1d78).
          launchctl load "$PLIST"
          echo "HTTP MCP service plist unchanged but was unloaded — loaded"
        else
          # Plist unchanged and loaded: force a restart onto the new binary.
          # kickstart -k is deterministic — no FSEvents/WatchPaths dependency
          # (rosary-de1237: the service ran a 5-day-stale binary otherwise).
          launchctl kickstart -k "gui/$(id -u)/$LABEL"
          echo "HTTP MCP service kickstarted onto the new binary"
        fi
        rm -f "$STAGED"
        echo "  Port: 8383 | Log: $LOG"

  overnight:
    desc: Start overnight loop (concurrency=1, bugs first, caffeinate)
    deps: [install]
    cmds:
      - |
        caffeinate -dims &
        echo "Caffeinate PID: $!"
        nohup rsry run --config rosary-self.toml --overnight > /tmp/rsry-overnight.log 2>&1 &
        echo "Rosary PID: $!"
        echo "Log: /tmp/rsry-overnight.log"
        echo "Stop: kill $(cat /tmp/rsry-overnight.pid 2>/dev/null || echo $!)"
        tail -f /tmp/rsry-overnight.log

  e2e:
    desc: End-to-end sandbox test (requires Dolt server in .beads/)
    deps: [build]
    cmds:
      - ./scripts/e2e-sandbox.sh

  e2e:fresh:
    desc: Fresh-setup regression test — vanilla Ubuntu, prereqs, build, smoke
    # Builds e2e.Dockerfile and runs scripts/e2e-fresh-setup.sh inside the
    # container. Mirrors the documented "first-time user" path on a clean
    # machine — asserts that `rsry enable` rejects a missing dolt identity
    # without half-initializing .beads/, and that no migration-noise
    # regression has snuck back in.
    cmds:
      - docker build -f e2e.Dockerfile -t rosary-e2e .
      - docker run --rm rosary-e2e

  integration:
    desc: Rust CLI integration tests (requires dolt in PATH)
    deps: [build]
    cmds:
      - cargo test --test cli_integration -- --test-threads=1

  apk:
    desc: "[deferred] Build distroless OCI image via melange + apko (release)"
    # Kept for reference; the active path is `task image` (krust + image.Dockerfile)
    # — adopted from ley-line-open after its melange path stalled on Apple Silicon
    # (ley-line-open-2b255c). Bind-mounting this repo's 31GB target/ into a melange
    # docker runner makes the `populating workspace` phase pathological.
    cmds:
      - melange keygen melange.rsa
      - |
        melange build melange.yaml \
          --arch {{.UNAME_M}} \
          --signing-key melange.rsa \
          --out-dir ./packages
      - |
        apko build apko.yaml \
          rosary:{{.VERSION}} \
          rosary.tar \
          --keyring-append melange.rsa.pub
      - echo "Built rosary.tar (load with docker load < rosary.tar)"

  # Image build/publish moved to `.taskfiles/image.yml` (included below under the
  # `image:` namespace): `task image:build` / `image:smoke` / `image:release`.

  setup:
    desc: First-time setup — install git hooks, conductor deps
    cmds:
      - |
        if command -v pre-commit >/dev/null 2>&1; then
          pre-commit install
          pre-commit install --hook-type commit-msg
          echo "✓ Git hooks installed (pre-commit + commit-msg)"
        else
          echo "SKIP: pre-commit not found (brew install pre-commit)"
        fi
      - |
        if command -v rsry >/dev/null 2>&1; then
          rsry enable .
          echo "✓ Repo registered with rosary"
        else
          echo "SKIP: rsry not found (brew install rosary — coming soon)"
        fi

  all:
    desc: Alias for the canonical verification gate
    cmds:
      - task: check

  ci:
    desc: CI alias for the canonical verification gate
    # CI is secondary to this Taskfile: GitHub Actions delegates here, and this
    # target delegates to `check` instead of duplicating raw tool commands.
    cmds:
      - task: check
