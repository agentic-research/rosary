# Render bead-record changes into a PR comment.
#
# WHY THIS EXISTS (rosary-fa7167 Q1)
#
# The in-tree tracked `.beads/beads.jsonl` has exactly one benefit no other
# surveyed work-tracker offers: a bead change is reviewable in the PR diff
# ("this commit added exactly one bead"). That single benefit is the whole
# argument for keeping canonical beads in the working tree, and it buys three
# costs (docs/prior-art/state-sync-sota.md): commit-coupling, merge conflicts
# against code, and a hook that must stage a file — all three measured biting
# on 2026-07-27.
#
# Q1 asks whether that benefit is RECOVERABLE OUT OF TREE. This workflow is the
# answer: `rsry bead diff` resolves its snapshots from git objects, so the same
# review surface works whether bead state lives in the working tree, at a rev,
# or behind a ref. It therefore renders a BETTER review than the raw file diff
# (which is 1100+ lines of JSONL noise) while being indifferent to where the
# state lives.
#
# NOTE ON REFS (Q3, measured): a plain `git clone` and `actions/checkout` fetch
# only `refs/heads/*`. A custom namespace like `refs/beads/*` needs an explicit
# refspec — see the commented-out step below. That cost is real and is why the
# canonical-location proposal is "stay in-tree"; this workflow deliberately
# supports both so the decision is not forced by tooling.

name: bead-diff

on:
  pull_request:
    paths:
      - '.beads/beads.jsonl'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bead-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Need the merge base to diff against, not just the tip.
          fetch-depth: 0

      # If canonical beads ever move to a ref namespace, this is the only
      # change required here — the differ already reads `refs/…` sources:
      # - run: git fetch origin '+refs/beads/*:refs/beads/*'

      # build.rs runs capnpc over schemas/cloister.capnp and panics without
      # the schema compiler; libfuse3-dev is the other native dep. Mirrors
      # ci.yml's "install system dependencies" step — keep them in sync.
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev capnproto

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      - name: Build rsry
        run: cargo build --release --bin rsry

      - name: Render bead diff
        id: diff
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Both sides are git objects — the working tree is never consulted.
          ./target/release/rsry bead diff \
            --from "${BASE}:.beads/beads.jsonl" \
            --to   "${HEAD}:.beads/beads.jsonl" \
            > bead-diff.md

          # Surface it in the run summary too, so the signal survives even if
          # commenting is unavailable (fork PRs get a read-only token).
          cat bead-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: bead-diff.md

      # Separate, non-blocking job step: a bead vanishing from the record is
      # the shape of every data-loss incident this repo has had (rosary-05fbe0
      # wiped 1115 records; ley-line-open stranded 26). Surfaced as a distinct
      # failure so it cannot be lost in the comment body.
      - name: Fail if beads were removed
        run: |
          ./target/release/rsry bead diff \
            --from "${{ github.event.pull_request.base.sha }}:.beads/beads.jsonl" \
            --to   "${{ github.event.pull_request.head.sha }}:.beads/beads.jsonl" \
            --fail-on-removal > /dev/null
