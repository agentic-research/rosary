name: Rosary CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly clean build (no cache) to catch stale-cache regressions
    - cron: '17 4 * * 1'

permissions:
  contents: read
  actions: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  verify:
    name: task check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev capnproto
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt,clippy
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: github.event_name != 'schedule'
        with:
          shared-key: rosary-${{ hashFiles('Cargo.lock') }}
      - name: install semgrep
        run: pip install semgrep
      # Taskfile.yml owns the verification contract. CI is deliberately thin:
      # install prerequisites, then run the same named gate agents use locally.
      - run: task check
