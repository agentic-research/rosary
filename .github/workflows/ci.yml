name: Rosary CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly clean build (no cache) to catch stale-cache regressions
    - cron: '17 4 * * 1'

permissions:
  contents: read
  actions: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: configure git auth for private deps
        if: ${{ secrets.LEYLINE_PAT != '' }}
        env:
          LEYLINE_PAT: ${{ secrets.LEYLINE_PAT }}
        run: git config --global url."https://x-access-token:${LEYLINE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: github.event_name != 'schedule'
        with:
          shared-key: rosary-${{ hashFiles('Cargo.lock') }}
      - run: cargo check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: configure git auth for private deps
        if: ${{ secrets.LEYLINE_PAT != '' }}
        env:
          LEYLINE_PAT: ${{ secrets.LEYLINE_PAT }}
        run: git config --global url."https://x-access-token:${LEYLINE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: github.event_name != 'schedule'
        with:
          shared-key: rosary-${{ hashFiles('Cargo.lock') }}
      - run: cargo test

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: configure git auth for private deps
        if: ${{ secrets.LEYLINE_PAT != '' }}
        env:
          LEYLINE_PAT: ${{ secrets.LEYLINE_PAT }}
        run: git config --global url."https://x-access-token:${LEYLINE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt,clippy
      - name: install semgrep
        run: pip install semgrep
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: github.event_name != 'schedule'
        with:
          shared-key: rosary-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

