name: smells

# Structural code-smell ratchet, owned by mache's rule registry (ADR-0018) —
# NOT reinvented in bash. The reusable mache find-smells action downloads the
# mache binary (>= v0.13.0 auto-provisions the leyline backend so all _ast rules
# run), builds an index over this checkout, uploads SARIF to code-scanning, and
# fails the job on findings that EXCEED the committed docs/smell-baseline.json.
#
# Both the action ref and the mache version are pinned to the SAME release tag
# (v0.18.0) so the gate is reproducible — a drifting `@main` action SHA silently
# changes the invocation contract under a fixed binary version. mache >= v0.17.0
# selects rules with `--tags=gate`, so an external rule in docs/smell-rules/ MUST
# carry `"Tags": ["gate"]` or it is silently filtered out of the gate.
#
# This is a code-scanning surface (same class as CodeQL), deliberately a separate
# workflow from ci.yml so it does not collide with the `task check` verification
# contract (check-taskfile-contract.sh gates ci.yml only). Local mirror: `task smells`.
# Regenerate the baseline after an intentional change and commit it (see `task smells`).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # required for the action's SARIF upload to code-scanning

jobs:
  find-smells:
    name: mache find-smells
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Load rosary's custom smell rules (JSON-of-SQL) so `--rule '*' --tags=gate`
    # includes them — e.g. long_file_rosary (Golden Rule 2, >500 lines). mache
    # reads this at process start; setting it at the job level propagates to the
    # action's find-smells steps. The baseline is generated with the same dir set.
    env:
      MACHE_SMELL_RULES_DIR: ${{ github.workspace }}/docs/smell-rules
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: agentic-research/mache/.github/actions/find-smells@dd5a30be1908ae4a9f52ec7b6c27abe5e4a8241d # v0.18.0
        with:
          mache-version: v0.18.0
          baseline: docs/smell-baseline.json
          fail-on-new: 'true'
          upload-sarif: 'true'
