name: coverage

# CI-enforced coverage ratchet (rosary-ae05a5), approach (a) — CI is the source
# of truth for the baseline, sidestepping the local↔CI coverage divergence (CI
# has no dolt/jj, so those tests skip and coverage differs). On push-to-main the
# job regenerates a CI-native baseline and commits it back; PRs check against it.
# Bootstrap-safe: until the first CI-native baseline lands, PR enforcement is
# skipped (the coverage-ratchet script gates on the baseline's `env` marker).
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/coverage-baseline.json # the commit-back below must not re-trigger
  pull_request:

permissions:
  contents: write # push the baseline branch
  # Open the baseline PR. Without this the job pushes the branch fine and then
  # dies on `gh pr create` with "Resource not accessible by integration" — which
  # is what happened on the first run after #436.
  #
  # If it STILL fails after this, the remaining blocker is the org/repo setting
  # "Allow GitHub Actions to create and approve pull requests", which no
  # workflow permission can substitute for and which needs an admin.
  pull-requests: write

jobs:
  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev capnproto
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-llvm-cov --locked

      # PRs: enforce (skips itself until a CI-native baseline exists on main).
      - if: github.event_name == 'pull_request'
        run: task coverage

      # Push to main: regenerate the CI-native baseline and propose it as a PR.
      #
      # It used to `git push` straight at main, which the `main` branch ruleset
      # blocks — and the failure was swallowed into a `::warning::`, so the job
      # stayed green while the committed baseline stayed the dev-machine one
      # (no `env` key). Every PR then hit the bootstrap skip below and enforced
      # NOTHING, green, for as long as the gate had existed.
      #
      # A PR needs no ruleset bypass: pushing a non-main branch is allowed, so
      # this arms itself without an admin change (rosary-f78208).
      - if: github.event_name == 'push'
        env:
          COVERAGE_ENV: ci
        run: task coverage:baseline
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet docs/coverage-baseline.json; then
            echo "baseline unchanged"
            exit 0
          fi
          BRANCH=coverage/ci-baseline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/coverage-baseline.json
          git commit -m "[rosary-ae05a5] chore(coverage): regenerate CI-native baseline"
          # force-with-lease is wrong here: the branch is a scratch pad this job
          # owns outright, and a stale remote copy from an earlier run must not
          # block the refresh.
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "baseline PR already open — updated in place"
          else
            printf '%s\n' \
              'Generated by the coverage workflow on push-to-main (COVERAGE_ENV=ci).' \
              '' \
              'Merging this ARMS the coverage ratchet. scripts/coverage-ratchet.py' \
              'skips enforcement in CI while the committed baseline lacks env=ci,' \
              'so until this lands every PR coverage check passes without' \
              'checking anything (rosary-f78208).' > /tmp/baseline-pr-body.md
            gh pr create --base main --head "$BRANCH" \
              --title "Regenerate the CI-native coverage baseline" \
              --body-file /tmp/baseline-pr-body.md
          fi
