name: coverage

# CI-enforced coverage ratchet (rosary-ae05a5), approach (c). The committed
# baseline (docs/coverage-baseline.json) covers only files with deterministic
# coverage — the env-dependent integration files (dolt/jj: dolt/*, store_dolt,
# bead_dolt, vcs, pool) are excluded via --ignore-filename-regex in the Taskfile,
# because CI lacks those tools so their tests skip and coverage would diverge.
# So a single committed baseline is valid both locally and in CI: no commit-back,
# no branch-ruleset friction. Fails a PR that drops an included file's coverage.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev capnproto
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-llvm-cov --locked
      - run: task coverage
