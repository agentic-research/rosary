name: coverage

# CI-enforced coverage ratchet (rosary-ae05a5), approach (a) — CI is the source
# of truth for the baseline, sidestepping the local↔CI coverage divergence (CI
# has no dolt/jj, so those tests skip and coverage differs). On push-to-main the
# job regenerates a CI-native baseline and commits it back; PRs check against it.
# Bootstrap-safe: until the first CI-native baseline lands, PR enforcement is
# skipped (the coverage-ratchet script gates on the baseline's `env` marker).
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/coverage-baseline.json # the commit-back below must not re-trigger
  pull_request:

permissions:
  contents: write # the main-push step commits the regenerated baseline

jobs:
  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev capnproto
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-llvm-cov --locked

      # PRs: enforce (skips itself until a CI-native baseline exists on main).
      - if: github.event_name == 'pull_request'
        run: task coverage

      # Push to main: regenerate the CI-native baseline and commit it back.
      - if: github.event_name == 'push'
        env:
          COVERAGE_ENV: ci
        run: task coverage:baseline
      - if: github.event_name == 'push'
        run: |
          if git diff --quiet docs/coverage-baseline.json; then
            echo "baseline unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/coverage-baseline.json
            git commit -m "chore(coverage): regenerate CI-native baseline [rosary-ae05a5]"
            git push
          fi
