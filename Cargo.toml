# Rosary — autonomous work orchestrator
[workspace]
members = [".", "crates/crypto", "crates/bdr"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/agentic-research/rosary"
homepage = "https://docs.rosary.bot"

[package]
name = "rosary"
version = "0.10.0"
edition.workspace = true
description = "Strings beads, repos, and review layers into coordinated work"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agents", "orchestration", "mcp", "issue-tracker", "automation"]
categories = ["development-tools", "command-line-utilities"]
# The `rosary` name on crates.io belongs to an unrelated crate; distribution is
# binary + OCI image. Flip deliberately if a publish story lands (rosary-d19eca).
publish = false

[[bin]]
name = "rsry"
path = "src/main.rs"

# Complexity no-creep gate — paired with clippy.toml thresholds. These two
# lints are off by default (nursery/pedantic); enabling them as `warn` makes
# the existing `task lint` (`cargo clippy -- -D warnings`) fail on any new
# function that exceeds the clippy.toml ceilings. Tightening: rosary-626db2.
[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "1.0.6"
shellexpand = "3.1.2"
dirs-next = "2.0.0"
sqlx-core = { version = "0.8.6", features = ["chrono", "tokio", "_rt-tokio"], default-features = false }
sqlx-mysql = { version = "0.8.6", features = ["chrono"], default-features = false }
reqwest = { version = "0.12", features = ["json", "blocking"] }
# The light content-address substrate (ContentAddressed::hash, BLAKE3-locked) —
# the single source of truth for content addresses across the ecosystem, so a
# bead's hash == a mache derivation's == the same CAS. rev-pinned. Byte-identical
# to the prior blake3 impl per rosary-bf6c74's golden vectors.
#
# rosary-30374f previously justified shelling out to the `jj` CLI because taking
# leyline-vcs would drag in "the heavy leyline-fs/jj-lib subtree". MEASURED
# (rosary-efd300, scripts/jj-lib-cost-gate.sh, baseline pinned at f8f6fbd):
#
#   baseline               349 crates    19.0 MiB
#   jj-lib direct (+git)   440 (+91)     24.5 MiB
#   leyline-vcs (this)     444 (+95)     24.6 MiB
#
# The *leyline-fs* half of the premise is false: leyline-fs comes in with
# default-features=false and no fuser/nfsserve/tree-sitter enters the tree, and
# only 4 of the 95 new crates are leyline's — taking jj-lib directly would save
# 4 crates and 0.15 MiB, i.e. nothing. The *heavy subtree* half is TRUE and was
# under-reported: an earlier run of this gate measured +34, but that was against
# a jj-lib with `default-features = false` and hence no Git backend — a build
# that cannot open a repo `jj git init` created. The real subtree is jj-lib's
# `gix` dependency and it costs +95 crates for +5.6 MiB.
# The rusqlite bump this needed (0.34 -> 0.39, rosary-7069df) required zero
# source changes, but does move libsqlite3-sys 0.32 -> 0.37 and with it the
# BUNDLED SQLITE ENGINE 3.49.1 -> 3.51.3.
leyline-core = { git = "https://github.com/agentic-research/ley-line-open", rev = "c3515b9", default-features = false }
# jj workspace creation driven IN-PROCESS via jj-lib (rosary-efd300) — no `jj`
# subprocess, and jj's native multi-workspace feature shares ONE backend store,
# so agent workspaces are copy-on-write instead of N full checkouts.
# rev-pinned like leyline-core. Takes leyline-fs with default-features=false, so
# no fuser/nfsserve/tree-sitter ride along (measured: scripts/jj-lib-cost-gate.sh).
#
# THE PIN MUST BE >= ley-line-open PR #257. Before it, leyline-vcs declared
# `jj-lib = { default-features = false }`, which compiled OUT jj-lib's
# `#[cfg(feature = "git")]` Git backend: `JjIntegration::open` then failed with
# "Cannot read the repo" on every repo `jj git init` produced, and
# `add_workspace` handed back a directory containing nothing but `.jj`. Both are
# hard dispatch failures for rosary. 1671942 is that PR's squash-merge commit on
# ley-line-open main. `workspace_root_pins_the_jj_git_backend` in
# src/workspace/tests.rs fails if a future repin drops the backend again.
leyline-vcs = { git = "https://github.com/agentic-research/ley-line-open", rev = "1671942", package = "leyline-vcs" }
# Build-time codegen plugin anchor — NOT referenced from rosary's source (no
# `use leyline_schema_bridge`), so its symbols are dead-stripped from rsry; it
# is a normal dep only because `cargo build -p leyline-schema-bridge --bin
# capnpc-schema-bridge-tooldefs` (Taskfile `registry:build`) needs it in the
# resolved graph, and cargo 1.94 panics resolving a dev-dependency-only
# external package via `-p`. Mirrors cloister's schema-bridge anchor (PR #143,
# crates/cas). SHA-pinned at the tooldefs-capable commit (LLO PR #232,
# ley-line-open-beb8bb): the `$doc`/`$optional`/`$default`/`$op` annotation
# vocabulary + the tooldefs emitter that reproduces rosary's MCP tools/list
# entries. The plugin builds against capnp =0.25 (LLO's workspace pin) in its
# own subgraph; rosary's capnp 0.21 (cloister_capnp) is untouched — the two
# capnp versions never cross the plugin's binary boundary.
leyline-schema-bridge = { git = "https://github.com/agentic-research/ley-line-open", rev = "c9ec2bbf8bf59de1dd82d6c147f93486b95715a0", version = "0.8.0", package = "leyline-schema-bridge" }
agent-client-protocol = "0.10.2"
async-trait = "0.1.89"
tokio-util = { version = "0.7", features = ["compat"] }
tungstenite = "0.28"
libc = "0.2"
bdr = { path = "crates/bdr" }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10" # interop only: DSSE/in-toto digests + provider webhook HMAC. NOT for CAS.
# blake3 is no longer a DIRECT dep (rosary-bf9cbf): CAS hashing goes through
# cas::content_hash → leyline-core's ContentAddressed::hash, so blake3 arrives
# transitively via leyline-core and rosary can't drift off the substrate lock.
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
owo-colors = "4.3.0"
jsonwebtoken = "9"
socket2 = "0.5"
rusqlite = { version = "0.39", features = ["bundled"] }
capnp = "0.21"
capnp-futures = "0.21"
# Force vendored OpenSSL so the musl cross-build (`task image` via krust)
# can produce a static binary without a target-native libssl on the host.
# Transitive: reqwest → native-tls → openssl-sys; adding the openssl direct
# dep with `vendored` propagates the feature globally.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
capnpc = "0.21"

[dev-dependencies]
# JSON Schema from Rust types (rosary-08a278). Dev-only for now: the registry
# proves equivalence against the hand-written schemas before anything is swapped,
# so nothing in the shipped binary depends on it yet.
schemars = "0.8"
# Property testing (rosary-c45a35). Every field-loss bug in this repo was
# written by someone who had example-based tests; examples only cover the
# fields the author remembered, which is the enumeration that went wrong.
proptest = "1"
futures = "0.3"
# TEST FIXTURE ONLY. `leyline_vcs::JjIntegration::init` builds a SimpleBackend
# repo (`Workspace::init_simple`) — a shape that exists only in tests, and the
# exact shape that made the first version of the jj workspace test pass while
# production failed. Building a GIT-BACKED repo (`init_internal_git`) is the
# only way to exercise what rosary actually runs against, and leyline-vcs does
# not expose an init for it. Adds nothing to the dependency graph: jj-lib is
# already there via leyline-vcs, same version, same features.
jj-lib = { version = "0.42", default-features = false, features = ["git"] }
pollster = "0.4"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
