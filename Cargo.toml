# Rosary — autonomous work orchestrator
[workspace]
members = [".", "crates/crypto", "crates/bdr"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/agentic-research/rosary"
homepage = "https://docs.rosary.bot"

[package]
name = "rosary"
version = "0.8.1"
edition.workspace = true
description = "Strings beads, repos, and review layers into coordinated work"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agents", "orchestration", "mcp", "issue-tracker", "automation"]
categories = ["development-tools", "command-line-utilities"]
# The `rosary` name on crates.io belongs to an unrelated crate; distribution is
# binary + OCI image. Flip deliberately if a publish story lands (rosary-d19eca).
publish = false

[[bin]]
name = "rsry"
path = "src/main.rs"

# Complexity no-creep gate — paired with clippy.toml thresholds. These two
# lints are off by default (nursery/pedantic); enabling them as `warn` makes
# the existing `task lint` (`cargo clippy -- -D warnings`) fail on any new
# function that exceeds the clippy.toml ceilings. Tightening: rosary-626db2.
[lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "1.0.6"
shellexpand = "3.1.2"
dirs-next = "2.0.0"
sqlx-core = { version = "0.8.6", features = ["chrono", "tokio", "_rt-tokio"], default-features = false }
sqlx-mysql = { version = "0.8.6", features = ["chrono"], default-features = false }
reqwest = { version = "0.12", features = ["json", "blocking"] }
# The ONLY LLO dependency: the light content-address substrate
# (ContentAddressed::hash, BLAKE3-locked) — the single source of truth for
# content addresses across the ecosystem, so a bead's hash == a mache
# derivation's == the same CAS. Light (no FUSE/rusqlite). vcs uses the `jj` CLI
# rather than leyline-vcs, so rosary carries none of the heavy leyline-fs/jj-lib
# subtree (rosary-30374f). rev-pinned; adopting current LLO wholesale needs a
# rusqlite bump (rosary-7069df). Byte-identical to the prior blake3 impl per
# rosary-bf6c74's golden vectors.
leyline-core = { git = "https://github.com/agentic-research/ley-line-open", rev = "c3515b9", default-features = false }
# Build-time codegen plugin anchor — NOT referenced from rosary's source (no
# `use leyline_schema_bridge`), so its symbols are dead-stripped from rsry; it
# is a normal dep only because `cargo build -p leyline-schema-bridge --bin
# capnpc-schema-bridge-tooldefs` (Taskfile `registry:build`) needs it in the
# resolved graph, and cargo 1.94 panics resolving a dev-dependency-only
# external package via `-p`. Mirrors cloister's schema-bridge anchor (PR #143,
# crates/cas). SHA-pinned at the tooldefs-capable commit (LLO PR #232,
# ley-line-open-beb8bb): the `$doc`/`$optional`/`$default`/`$op` annotation
# vocabulary + the tooldefs emitter that reproduces rosary's MCP tools/list
# entries. The plugin builds against capnp =0.25 (LLO's workspace pin) in its
# own subgraph; rosary's capnp 0.21 (cloister_capnp) is untouched — the two
# capnp versions never cross the plugin's binary boundary.
leyline-schema-bridge = { git = "https://github.com/agentic-research/ley-line-open", rev = "c9ec2bbf8bf59de1dd82d6c147f93486b95715a0", version = "0.8.0", package = "leyline-schema-bridge" }
agent-client-protocol = "0.10.2"
async-trait = "0.1.89"
tokio-util = { version = "0.7", features = ["compat"] }
tungstenite = "0.28"
libc = "0.2"
bdr = { path = "crates/bdr" }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10" # interop only: DSSE/in-toto digests + provider webhook HMAC. NOT for CAS.
# blake3 is no longer a DIRECT dep (rosary-bf9cbf): CAS hashing goes through
# cas::content_hash → leyline-core's ContentAddressed::hash, so blake3 arrives
# transitively via leyline-core and rosary can't drift off the substrate lock.
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
owo-colors = "4.3.0"
jsonwebtoken = "9"
socket2 = "0.5"
rusqlite = { version = "0.34", features = ["bundled"] }
capnp = "0.21"
capnp-futures = "0.21"
# Force vendored OpenSSL so the musl cross-build (`task image` via krust)
# can produce a static binary without a target-native libssl on the host.
# Transitive: reqwest → native-tls → openssl-sys; adding the openssl direct
# dep with `vendored` propagates the feature globally.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
capnpc = "0.21"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
