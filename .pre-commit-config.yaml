repos:
  # Markdown formatting
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
        exclude: '^\.beads/'

  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Golden Rules enforcement
  - repo: local
    hooks:
      # Rule 1: No versioned files
      - id: no-versioned-files
        name: no versioned files (Rule 1)
        entry: scripts/check-versioned-files.sh
        language: script
        types: [file]

      # Rule 2 (file length) + the god-file gate retired (rosary-4fe0b2): both
      # were bash wc -l reinventions of mache's structural rules. They are now
      # mache-native — `mache find-smells` over docs/smell-rules/ (Golden Rule 2 =
      # long_file_rosary @500) plus the built-in long_file/god_file — ratcheted
      # against docs/smell-baseline.json. Enforced by `task smells` locally and
      # the mache find-smells action in CI (.github/workflows/smells.yml).

      # persist_status ratchet: imperative bead-state-write sites may only
      # DECREASE — a duplicated-logic smell that drives toward the single
      # fold-driven writer (R4b / rosary-a66b3a). "State is a fold over
      # observations, not an imperative mutation" — enforced, not documented.
      - id: persist-status-ratchet
        name: persist_status ratchet (state = fold, not scattered mutation)
        entry: scripts/check-persist-status-ratchet.sh
        language: script
        pass_filenames: false
        files: \.rs$

      # Rule 11: Every commit references a bead
      - id: bead-ref
        name: bead reference in commit (Rule 11)
        entry: scripts/check-bead-ref.sh
        language: script
        stages: [commit-msg]
        always_run: true

  # Rust-specific checks (Incremental, Full-Crate Check)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && cargo fmt -- --check'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && PKG_CONFIG_PATH="${LEY_LINE_DIR:-$ROOT/../ley-line}/rs/pkgconfig" cargo clippy --all-targets -- -D warnings'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: semgrep
        name: semgrep custom rules
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && semgrep --config .semgrep/rules.yml --error .'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash -c 'ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && PKG_CONFIG_PATH="${LEY_LINE_DIR:-$ROOT/../ley-line}/rs/pkgconfig" cargo test --quiet'
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [pre-push]

      # Conductor (Elixir) moved to rig repo — see rig-962ca4
